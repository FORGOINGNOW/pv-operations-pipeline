[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-operations-pipeline"
version = "0.1.0"
description = "Reproducible synthetic household photovoltaic operations pipeline"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "duckdb>=1.1,<2", "scikit-learn>=1.5,<2", "plotly>=5.22,<7", "PyYAML>=6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[project.scripts]
pv-pipeline = "pv_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

