name: Synthetic PV checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PV_PYTHON=python bash scripts/01_bootstrap.sh
      - run: .venv/bin/python -m ruff check src tests scripts/*.py && .venv/bin/python -m ruff format --check src tests scripts/*.py
      - run: .venv/bin/python -m pytest -q
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: shellcheck -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh
      - run: bash scripts/90_demo.sh --config configs/smoke.yaml --run-id ci-smoke
      - run: .venv/bin/python scripts/verify_sql.py --root runtime/smoke
      - run: .venv/bin/python scripts/validate_contracts.py --root runtime/smoke
      - run: .venv/bin/python scripts/verify_recovery.py
      - run: .venv/bin/python scripts/verify_late.py
      - run: .venv/bin/python scripts/evaluate_quality.py --config configs/smoke.yaml --root runtime/smoke
      - run: .venv/bin/python -m pip_audit --skip-editable --format json --output runtime/security-audit.json
